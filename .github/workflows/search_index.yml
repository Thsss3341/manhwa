name: Search index

on:
  schedule:
    - cron: '17 19 * * *'
  push:
    branches:
      - main
    paths:
      - '.github/scripts/build-yueman-index.py'
      - '.github/workflows/search_index.yml'
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  build:
    name: Build yueman search index
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - name: Checkout main branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: main
          persist-credentials: false

      - name: Check out search branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads "$REMOTE" search > /dev/null; then
            git clone --depth 1 --branch search "$REMOTE" search
          else
            git init -b search search
            git -C search remote add origin "$REMOTE"
          fi

      - name: Build index
        run: python main/.github/scripts/build-yueman-index.py search/yueman.tsv

      # Keep the branch at a single commit so the daily rebuild doesn't grow the repository.
      - name: Push search branch
        working-directory: search
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git rev-parse --verify -q HEAD > /dev/null && git diff --cached --quiet; then
            echo "Index unchanged"
            exit 0
          fi
          git checkout -q --orphan fresh
          git commit -q -m "Update yueman search index"
          git push --force origin fresh:search
